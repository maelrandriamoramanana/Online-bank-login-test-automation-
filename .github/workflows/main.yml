name: Playwright Enterprise Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps

    - name: Launch tests by injecting secrets from GitHub
      run: pytest --alluredir=allure-results
      env:
        HEADLESS: "true"
        STANDARD_USER: ${{ secrets.STANDARD_USER }}
        STANDARD_PASS: ${{ secrets.STANDARD_PASS }}
        LOCKED_USER: ${{ secrets.LOCKED_USER }}
        LOCKED_PASS: ${{ secrets.LOCKED_PASS }}
        FAILED_USER: ${{ secrets.FAILED_USER }}
        FAILED_PASS: ${{ secrets.FAILED_PASS }}

    - name: Store Allure reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        retention-days: 30